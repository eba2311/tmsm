services:
  - type: web
    name: tmsm-app
    env: docker
    plan: free
    branch: main
    envVars:
      - key: PORT
        value: 4002
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://tmsm-app.onrender.com
      - key: CORS_ORIGIN
        value: https://tmsm-app.onrender.com
      # Replace with your production PostgreSQL DATABASE_URL.
      # For SSL, append ?sslmode=require to the connection string.
      - key: DATABASE_URL
        value: postgresql://postgres:password@your-postgres-host:5432/tmsm
      - key: JWT_SECRET
        value: change-this-to-a-strong-random-secret
      - key: JWT_REFRESH_SECRET
        value: change-this-to-a-different-strong-random-secret
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 10000
