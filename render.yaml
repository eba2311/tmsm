services:
  - type: web
    name: tmsm-app
    env: docker
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromDatabase:
          name: tmsm
          property: FRONTEND_URL
      - key: CORS_ORIGIN
        fromDatabase:
          name: tmsm
          property: CORS_ORIGIN
      - key: DATABASE_URL
        fromDatabase:
          name: tmsm
          property: DATABASE_URL
      - key: JWT_SECRET
        fromService:
          type: secret
          property: JWT_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: secret
          property: JWT_REFRESH_SECRET
      - key: SESSION_SECRET
        fromService:
          type: secret
          property: SESSION_SECRET
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 10000
      - key: LOG_LEVEL
        value: info

  - type: pserv
    name: tmsm-postgres
    env: postgres
    plan: free
    ipAllowList: []
    databases:
      - name: tmsm
        user: postgres
        version: "15"

databases:
  - name: tmsm
    databaseName: tmsm
    user: postgres
    region: us-east-1

